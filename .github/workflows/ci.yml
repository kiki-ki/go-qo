name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: make test

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # A separate cache key from the other jobs, so the cache saved here includes the tools.
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Install tools
        run: make install-tool
      - name: Check format & tidy
        run: |
          make tidy fmt
          git diff --exit-code
      - name: Check lint & vuln
        run: |
          make lint
          make vuln

  check-releaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Read GoReleaser version
        id: goreleaser-version
        run: |
          version=$(make -s goreleaser-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run GoReleaser (dry-run)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ steps.goreleaser-version.outputs.version }}
          args: release --snapshot --clean

  status-check:
    runs-on: ubuntu-latest
    if: always()
    needs: [test, check, check-releaser]
    steps:
      - run: |
          if [[ ${{ contains(needs.*.result, 'failure') }} == 'true' || ${{ contains(needs.*.result, 'cancelled') }} == 'true' ]]; then
            echo "❌ Checks failed"
            exit 1
          fi
          echo "✅ All checks passed"
