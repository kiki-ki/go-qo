version: 2

project_name: qo

builds:
  - binary: qo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/kiki-ki/go-qo/cmd.version={{.Version}}
    main: ./cmd/qo

archives:
  - formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

release:
  # Re-running a release replaces its artifacts instead of failing on the
  # names that are already uploaded.
  mode: replace

homebrew_casks:
  - repository:
      owner: kiki-ki
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/kiki-ki/go-qo
    description: "Query JSON data with SQL"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/qo"]
          end

changelog:
  use: github-native
